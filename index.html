<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation - Rahul & Priya</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="invitation-container">
        <div class="floral-top"></div>
        
        <div class="content">
            <h5 class="subtitle animate-fade">Together with their families</h5>
            <h1 class="names animate-pop">Rahul <span class="ampersand">&</span> Priya</h1>
            
            <p class="invite-text animate-slide">
                Joyfully invite you to celebrate their wedding day
            </p>

            <div class="event-details animate-fade">
                <div class="date-box">
                    <span class="day">Sunday</span>
                    <span class="date">28 . 11 . 2026</span>
                    <span class="time">10:30 AM onwards</span>
                </div>
                <p class="venue">
                    <strong>Grand Palace Lawns</strong><br>
                    Banjara Hills, Hyderabad
                </p>
            </div>

            <div class="rsvp-section animate-slide">
                <button onclick="alert('Thank you for responding!')" class="rsvp-btn">RSVP</button>
            </div>
        </div>

        <div class="floral-bottom"></div>
    </div>

</body>
</html>
